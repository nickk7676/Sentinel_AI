<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · Institute Admissions Portal (fake)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "_header.html" %}
  <main>
    <div class="card">
      <h2>Applicant sign in</h2>
      <p class="kv" style="font-family:system-ui,sans-serif;font-size:13px;">
        Sign in to view your application status, decisions, and financial-aid offer.
      </p>
      <form id="loginForm" autocomplete="off">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="your.username">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="••••••••">
        <button type="submit">Sign in</button>
      </form>
      <div id="result" class="result" style="display:none;"></div>
    </div>
    <div class="foot">Fictional security demo. Not affiliated with, endorsed by, or representative of MIT.</div>
  </main>

  <script>
    const form = document.getElementById('loginForm');
    const result = document.getElementById('result');
    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      const body = new URLSearchParams();
      body.set('username', document.getElementById('username').value);
      body.set('password', document.getElementById('password').value);
      result.style.display = 'block';
      result.textContent = 'Authenticating…';
      try {
        const resp = await fetch('/login', { method: 'POST', body });
        const data = await resp.json();
        if (data.session_token) {
          sessionStorage.setItem('session_token', data.session_token);
          sessionStorage.setItem('matched_user', data.matched_user || 'applicant');
        }
        if (data.status === 'success') {
          result.className = 'result ok';
          result.textContent = (data.message || 'Signed in') + ' — redirecting…';
          setTimeout(() => { window.location = '/dashboard'; }, 650);
        } else {
          result.className = 'result';
          result.textContent = data.message || 'Invalid credentials';
        }
      } catch (err) {
        result.className = 'result';
        result.textContent = 'Error: ' + err;
      }
    });
  </script>
</body>
</html>
