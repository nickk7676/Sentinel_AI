<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dashboard · Institute Admissions Portal (fake)</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  {% include "_header.html" %}
  <main>
    <div class="card">
      <h2>Welcome back, <span id="who">applicant</span></h2>
      <p class="kv" style="font-family:system-ui,sans-serif;font-size:13px;">Your admissions workspace.</p>
      <p><a class="navlink" href="/application">▸ View my application case</a></p>
      <p><a class="navlink" href="/link-preview">▸ Preview an application link</a></p>
      <p><a class="navlink" href="/recovery">▸ Account recovery</a></p>
    </div>
    <div class="card">
      <h2>My application</h2>
      <div id="mine" class="result">Loading…</div>
    </div>
    <div class="foot">Fictional security demo. Not affiliated with, endorsed by, or representative of MIT.</div>
  </main>
  <script>
    document.getElementById('who').textContent = sessionStorage.getItem('matched_user') || 'applicant';
    (async () => {
      const token = sessionStorage.getItem('session_token') || '';
      const mine = document.getElementById('mine');
      try {
        const resp = await fetch('/api/tickets/1', { headers: { 'Authorization': 'Bearer ' + token } });
        const d = await resp.json();
        mine.textContent = JSON.stringify(d, null, 2);
      } catch (e) { mine.textContent = 'Could not load application.'; }
    })();
  </script>
</body>
</html>
