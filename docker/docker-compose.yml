# Step 5 - brings up every lab target across every technique in one shot,
# instead of 24 manual `docker compose up` calls (one per lab/<dir>).
# Per-target lab/<dir>/docker-compose.yml files still work standalone for
# focused debugging of a single target.
#
# Usage: docker compose -f docker/docker-compose.yml up -d --build

services:
  # --- sql_injection ---
  lab-target:
    build: ../lab/target
    ports: ["5001:5000"]
    restart: unless-stopped
  lab-sql-injection-express:
    build: ../lab/sql_injection_express
    ports: ["5101:5000"]
    restart: unless-stopped
  lab-sql-injection-django:
    build: ../lab/sql_injection_django
    ports: ["5201:5000"]
    restart: unless-stopped
  lab-sql-injection-distractor:
